name: Refresh Massachusetts municipality baseline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-ma-directory.yml"
      - "scripts/ingest_ma_municipalities.py"
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: civicpatch-ma-ingestion
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install no third-party Python packages
        run: python --version
      - name: Fetch official municipality registry and candidate website links
        run: python scripts/ingest_ma_municipalities.py
      - name: Validate refreshed directory
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_ma_directory.py
          python scripts/report_ma_coverage.py
      - name: Open or update review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/refresh-ma-directory
          delete-branch: false
          commit-message: "data: refresh Massachusetts municipality baseline"
          title: "Automated data refresh: Massachusetts municipality baseline"
          body: |
            ## Automated source refresh

            This pull request was generated from the MassGIS municipality feature layer and the Commonwealth's city-and-town website directory.

            - Registry identifiers and official names are imported from MassGIS.
            - Website links are candidates harvested by exact municipality-label matching from the Commonwealth directory.
            - OCD-IDs remain null until semantically validated.
            - Municipality records remain incomplete and no department responsibility is inferred.
            - Please review changed names, website links, provenance and coverage before merging.

            Generated by `.github/workflows/refresh-ma-directory.yml`.
          draft: true
