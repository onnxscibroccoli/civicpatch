name: Deploy CivicPatch to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'onnxscibroccoli/civicpatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out immutable production main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate production assets and tests without deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s README.md
          test -s LICENSE
          test -s CONTRIBUTING.md
          test -s data/ma/municipalities.json
          grep -q 'not a fully verified Massachusetts-wide service' index.html
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -v
          python3 scripts/validate_ma_directory.py
      - name: Resolve alpha and beta stage commits if published
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          for stage in alpha beta; do
            if git fetch --quiet --no-tags --depth=1 origin "refs/heads/agent/$stage:refs/remotes/origin/agent/$stage"; then
              sha="$(git rev-parse "refs/remotes/origin/agent/$stage^{commit}")"
              [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
              echo "$stage=$sha" >> "$GITHUB_OUTPUT"
            else
              echo "No agent/$stage branch; leaving /$stage unpublished."
            fi
          done
      - name: Resolve independently versioned Alpha and Beta frontend lab commits
        id: frontend
        shell: bash
        run: |
          set -euo pipefail
          for stage in alpha beta; do
            if git fetch --quiet --no-tags --depth=1 origin "refs/heads/agent/$stage-frontend:refs/remotes/origin/agent/$stage-frontend"; then
              sha="$(git rev-parse "refs/remotes/origin/agent/$stage-frontend^{commit}")"
              [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
              echo "${stage}_frontend=$sha" >> "$GITHUB_OUTPUT"
            else
              echo "No $stage frontend branch; leaving the experiment unpublished."
            fi
          done
      - name: Assemble production plus labeled non-indexed preview directories
        env:
          ALPHA: ${{ steps.preview.outputs.alpha }}
          BETA: ${{ steps.preview.outputs.beta }}
          ALPHA_FRONTEND: ${{ steps.frontend.outputs.alpha_frontend }}
          BETA_FRONTEND: ${{ steps.frontend.outputs.beta_frontend }}
        run: python3 scripts/build_pages_bundle.py --output "$RUNNER_TEMP/civicpatch-site" --alpha "$ALPHA" --beta "$BETA" --alpha-frontend "$ALPHA_FRONTEND" --beta-frontend "$BETA_FRONTEND"
      - name: Verify bundled output and preview route requirements
        env:
          ALPHA: ${{ steps.preview.outputs.alpha }}
          BETA: ${{ steps.preview.outputs.beta }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/civicpatch-site/index.html"
          test -s "$RUNNER_TEMP/civicpatch-site/data/ma/municipalities.json"
          if [ -n "$ALPHA" ]; then test -s "$RUNNER_TEMP/civicpatch-site/alpha/index.html"; fi
          if [ -n "$BETA" ]; then test -s "$RUNNER_TEMP/civicpatch-site/beta/index.html"; fi
          if [ -n "${{ steps.frontend.outputs.alpha_frontend }}" ]; then
            test -s "$RUNNER_TEMP/civicpatch-site/alpha/agentic/index.html"
            test -s "$RUNNER_TEMP/civicpatch-site/alpha/agentic/base.js"
            test -s "$RUNNER_TEMP/civicpatch-site/alpha/agentic/style.css"
          fi
          if [ -n "${{ steps.frontend.outputs.beta_frontend }}" ]; then
            test -s "$RUNNER_TEMP/civicpatch-site/beta/agentic/index.html"
          fi
          test ! -e "$RUNNER_TEMP/civicpatch-site/.github"
          test ! -e "$RUNNER_TEMP/civicpatch-site/scripts"
      - name: Upload tested, sanitized Pages artifact without a deploy token
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/civicpatch-site

  deploy:
    needs: build
    if: github.repository == 'onnxscibroccoli/civicpatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish production and available previews atomically
        id: deployment
        uses: actions/deploy-pages@v4
