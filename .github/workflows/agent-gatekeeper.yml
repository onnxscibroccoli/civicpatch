name: Agent independent gatekeeper

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Agent-generated draft PR number"
        required: true
        type: string
      expected_sha:
        description: "Immutable 40-character PR head SHA"
        required: true
        type: string

permissions: {}

concurrency:
  group: civicpatch-agent-promotion
  cancel-in-progress: false

jobs:
  admit:
    if: github.repository == 'onnxscibroccoli/civicpatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
      contents: read
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      pr: ${{ steps.validate.outputs.pr }}
    steps:
      - name: Independently validate PR provenance and exact changed-file allowlist
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.pr_number }}
          EXPECTED: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NUMBER" =~ ^[0-9]{1,7}$ ]] || exit 1
          [[ "$EXPECTED" =~ ^[a-f0-9]{40}$ ]] || exit 1
          gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json number,headRefName,headRefOid,baseRefName,files,state,isDraft > "$RUNNER_TEMP/pr.json"
          python3 - "$RUNNER_TEMP/pr.json" "$EXPECTED" <<'PY'
          import json, sys
          obj = json.load(open(sys.argv[1], encoding="utf-8"))
          allowed = {
              "scripts/check_source_urls.py", "tests/test_source_url_health.py",
              "scripts/validate_ma_directory.py", "tests/test_ma_directory.py",
              "scripts/report_ma_coverage.py", "tests/test_ma_coverage_report.py",
              ".github/autodev/progress.json",
          }
          paths = {item["path"] for item in obj["files"]}
          assert obj["state"] == "OPEN"
          assert obj["headRefName"] == "automation/autodev-next"
          assert obj["baseRefName"] == "main"
          assert obj["headRefOid"] == sys.argv[2]
          assert paths <= allowed and ".github/autodev/progress.json" in paths
          assert any(path.startswith("scripts/") for path in paths)
          assert any(path.startswith("tests/") for path in paths)
          assert len(paths) == 3, f"Exactly source, test, progress required: {paths}"
          print("Admitted immutable PR head:", obj["headRefOid"])
          PY
          echo "sha=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "pr=$NUMBER" >> "$GITHUB_OUTPUT"

  verify:
    needs: admit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out immutable candidate without persisted token
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.admit.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and execute full secret-free Python regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -v
          python3 scripts/validate_ma_directory.py
          python3 scripts/report_ma_coverage.py

  promote:
    needs: [admit, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.admit.outputs.sha }}
      NUMBER: ${{ needs.admit.outputs.pr }}
    steps:
      - name: Confirm PR head has not changed since independent tests
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          test "$actual" = "$SHA"
      - name: Promote tested head to beta branch (static preview source)
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/agent/beta" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/agent/beta" -f sha="$SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/agent/beta -f sha="$SHA" >/dev/null
          fi
      - name: Preserve verified beta candidate for review
        shell: bash
        run: |
          set -euo pipefail
          echo "Candidate $SHA passed independent tests and is available on agent/beta."
          echo "Production promotion requires an explicit separately authorized release."
